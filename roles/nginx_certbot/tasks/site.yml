---
- name: Check if cert exists for {{ site_domain }}
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ site_domain }}/fullchain.pem"
  register: cert_stat
  become: true

- name: Remove stale site config before obtaining cert
  ansible.builtin.file:
    path: "/etc/nginx/conf.d/{{ site_domain }}.conf"
    state: absent
  become: true
  notify: reload nginx
  when: not cert_stat.stat.exists

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Obtain certificate for {{ site_domain }}
  ansible.builtin.command: >
    certbot certonly --webroot
    -w /var/www/letsencrypt
    -d {{ site_domain }}{% if site_www | default(false) %} -d www.{{ site_domain }}{% endif %}
    --email {{ certbot_email }}
    --agree-tos
    --non-interactive
  become: true
  when: not cert_stat.stat.exists
  changed_when: true
  notify: reload nginx

- name: Deploy Nginx config for {{ site_domain }}
  ansible.builtin.template:
    src: nginx-site.conf.j2
    dest: "/etc/nginx/conf.d/{{ site_domain }}.conf"
    mode: '0644'
  become: true
  notify: reload nginx

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
