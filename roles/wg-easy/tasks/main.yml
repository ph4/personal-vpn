---
- name: Check Docker is available
  ansible.builtin.command: docker info
  register: docker_check
  failed_when: docker_check.rc != 0
  changed_when: false
  become: true

- name: Verify amneziawg module is present
  ansible.builtin.command: modinfo amneziawg
  register: awg_check
  failed_when: awg_check.rc != 0
  changed_when: false
  become: true
  when: wg_easy_use_awg | default(false)

- name: Setup nginx for wg-easy
  include_role:
    name: nginx_certbot
    tasks_from: site.yml

- name: Create compose directory
  ansible.builtin.file:
    path: "{{ compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: docker-compose restart

- name: Docker compose up
  community.docker.docker_compose_v2:
    project_src: "{{ compose_dir }}"
    pull: always
    state: present
  become: true
